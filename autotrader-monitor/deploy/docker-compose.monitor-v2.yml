services:
  redis:
    image: redis:7-alpine
    container_name: autotrader-monitor-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  autotrader-monitor:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: autotrader-monitor
    env_file:
      - ../.env
    environment:
      # Docker Desktop에서 NATS가 호스트 쪽 docker-compose-local.yml에 떠 있으면 이 값
      # Linux EC2에서 같은 compose network에 NATS가 있으면 nats://nats:4222
      NATS_URL: ${NATS_URL:-nats://host.docker.internal:4222}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: autotrader-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - autotrader-monitor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: autotrader-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
